name: Bug report
description: Something crashed, froze, looked wrong or didn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: "0.1"
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: Emulator and platform
      description: For example mGBA 0.10.2 on Windows, or a handheld or phone app.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did it happen?
      description: The map or town, and what you were doing.
      placeholder: "Fogshore City, talking to the Mart clerk"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you know how to make it happen again.
  - type: textarea
    id: extras
    attributes:
      label: Screenshots, save file or save state
      description: |
        A save state (.ss1, .ss2...) from just before the problem is the most useful thing you can attach.
        Drag files in here. Zip them if GitHub won't take the extension.
